<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ticket-scanner demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
    h1 { font-size: 1.4rem; margin-bottom: 0; }
    .version { color: #666; font-size: 0.85rem; margin-top: 4px; font-family: monospace; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-top: 20px; }
    button { padding: 8px 16px; font-size: 1rem; cursor: pointer; }
    #status { margin-top: 12px; color: #444; font-size: 0.9rem; min-height: 1.2em; }
    #result { background: #f6f6f6; border-radius: 6px; padding: 12px; white-space: pre-wrap; word-break: break-word; font-size: 0.85rem; margin-top: 12px; max-height: 480px; overflow: auto; }
    .note { color: #777; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>ticket-scanner demo</h1>
  <div class="version">engine version: <span id="version">not loaded yet</span></div>

  <div class="card">
    <p>Pick a plane-ticket image (photo/screenshot) or a PDF e-ticket/itinerary. Everything
    runs on-device — the file never leaves this browser tab.</p>
    <input id="file" type="file" accept="image/*,application/pdf" />
    <button id="scan">Scan</button>
    <p class="note">First run downloads the OCR model weights (~20MB) and wasm runtimes —
    cached afterward.</p>
    <div id="status"></div>
    <pre id="result"></pre>
  </div>

  <script type="module" src="./dist/bundle.js"></script>
</body>
</html>
